name: Actualisation RSS ITLF
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: itlf-rss
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actualiser le flux
        run: python itlf_rss.py
      - name: Publier les fichiers
        run: |
          git config user.name 'itlf-bot'
          git config user.email 'itlf-bot@users.noreply.github.com'
          git add rss.xml state.json
          git diff --cached --quiet || (git commit -m 'Mise à jour du trafic ITLF' && git push)
